<style>
/* Layout: full-screen canvas game, HTML touch controls pinned to the bottom corners, overlays for menus. Single jungle look. */
:root{--jungle:#0d3320;--deep:#08200f;--gold:#f5c400;--goldDark:#a87f00;--cream:#fff8e1;--ink:#2a1f00;--glass:rgba(10,30,18,.5);color-scheme:dark;
  --display:'Russo One','Arial Black',sans-serif;--body:'Nunito',system-ui,-apple-system,sans-serif}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--jungle);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--body);color:var(--cream);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0}
#cv{display:block;width:100%;height:100%}
.ctl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding:0 max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.pad{display:flex;gap:12px;align-items:flex-end;pointer-events:auto}
.act{display:grid;grid-template-columns:auto auto auto;grid-template-areas:"nun web bow" ". fist jump";gap:10px;align-items:end;justify-items:center}
.btn{width:70px;height:70px;border-radius:50%;border:3px solid rgba(255,248,225,.55);background:var(--glass);color:var(--cream);
  font:15px var(--display);display:flex;align-items:center;justify-content:center;padding:0;touch-action:none;cursor:pointer}
.btn.s{width:64px;height:64px;font-size:13px}
.btn.big{width:78px;height:78px;font-size:26px;border-color:rgba(245,196,0,.8)}
.btn.on{background:rgba(245,196,0,.5);border-color:var(--gold)}
#bNun{grid-area:nun;border-color:rgba(95,200,255,.9);font-size:11px}
@media (max-width:430px){.btn{width:60px;height:60px}.btn.s{width:54px;height:54px;font-size:11px}.btn.big{width:68px;height:68px}#bNun{font-size:9.5px}}
#bWeb{grid-area:web;border-color:rgba(255,77,109,.8)}#bBow{grid-area:bow}#bFist{grid-area:fist;border-color:rgba(79,216,255,.8)}#bJump{grid-area:jump}
#top{position:absolute;top:max(10px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:10px}
.mini{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,248,225,.5);background:var(--glass);color:var(--cream);font:16px var(--display);cursor:pointer;padding:0}
.mini.off{opacity:.5;text-decoration:line-through}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,24,13,.8);overflow:auto;touch-action:pan-y;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:540px;margin:auto}
.col{display:flex;flex-direction:column;align-items:center;gap:12px}
h1,h2{font-family:var(--display);font-weight:400;color:var(--gold);margin:0;text-wrap:balance;text-shadow:0 4px 0 #5b3f00}
h1{font-size:46px;line-height:1}
h1 span{display:block;font-size:20px;color:var(--cream);text-shadow:none;margin-top:8px;letter-spacing:.12em;text-transform:uppercase}
h2{font-size:32px;line-height:1.1}
.sub{margin:0;font-size:16px;line-height:1.45;max-width:34ch;font-weight:600}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.go{font:400 21px var(--display);background:var(--gold);color:var(--ink);border:0;border-radius:16px;padding:14px 30px;box-shadow:0 6px 0 var(--goldDark);cursor:pointer}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--goldDark)}
.ghost{font:800 16px var(--body);background:transparent;color:var(--cream);border:2px solid rgba(255,248,225,.5);border-radius:14px;padding:11px 20px;cursor:pointer}
.rules{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:0;margin:0;list-style:none}
.rules li{background:rgba(255,248,225,.1);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.rules b{color:var(--gold);font-weight:800}
#hero{width:130px;height:180px}
.skins{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.skin{display:flex;flex-direction:column;align-items:center;gap:2px;width:74px;padding:6px 4px;border-radius:12px;border:2px solid rgba(255,248,225,.25);background:rgba(255,248,225,.06);color:var(--cream);font:800 12px var(--body);cursor:pointer}
.skin.sel{border-color:var(--gold);background:rgba(245,196,0,.2)}
.skin:disabled{opacity:.6;cursor:default}
.skin canvas{width:36px;height:52px}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#probe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
@media (orientation:landscape) and (max-height:540px){.card{flex-direction:row;text-align:left;max-width:780px;gap:22px}.card .col{align-items:flex-start}.btns,.rules,.skins{justify-content:flex-start}.card .col{gap:10px}h1{font-size:38px}#hero{width:110px;height:152px}}
</style>

<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="top" hidden>
    <button class="mini" id="bPause" aria-label="Пауза">II</button>
    <button class="mini" id="bSound" aria-label="Звук">♪</button>
  </div>
  <div id="ctl" class="ctl" hidden>
    <div class="pad">
      <button class="btn" data-k="left" aria-label="Влево">◀</button>
      <button class="btn" data-k="right" aria-label="Вправо">▶</button>
    </div>
    <div class="pad act">
      <button class="btn s" id="bNun" data-k="nun" hidden>Нунчаки</button>
      <button class="btn s" id="bWeb" data-k="web" hidden>Сеть</button>
      <button class="btn s" id="bBow" data-k="bow">Лук</button>
      <button class="btn s" id="bFist" data-k="fist">Кулаки</button>
      <button class="btn big" id="bJump" data-k="jump" aria-label="Прыжок">▲</button>
    </div>
  </div>
  <div id="ov" class="screen"></div>
  <div id="probe"></div>
</div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const ov=document.getElementById('ov'),ctl=document.getElementById('ctl'),topBar=document.getElementById('top'),bWeb=document.getElementById('bWeb'),bNun=document.getElementById('bNun');
const T=40,ROWS=12,LH=ROWS*T,INK='#22262c';
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,DPR=1,scale=1,viewW=0,viewH=0,offY=0,SA={t:0,r:0,b:0,l:0};

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const portrait=H>W*1.05;
  scale=portrait?Math.min(W/420,H/(LH+220)):Math.min(H/LH,W/420);
  viewW=W/scale;viewH=H/scale;offY=portrait?Math.min(70,(viewH-LH)*0.3):viewH-LH;
  const cs=getComputedStyle(document.getElementById('probe'));
  SA={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};
}
addEventListener('resize',resize);resize();

/* ---------- save ---------- */
const SAVE='chichi-save-v1';
let save={level:1,skills:{rollers:false,web:false},flags:0,keys:0,skins:['base'],skin:'base'};
try{const s=JSON.parse(localStorage.getItem(SAVE));if(s&&s.level)save={level:s.level,skills:Object.assign({rollers:false,web:false,nun:false},s.skills),flags:s.flags||0,keys:s.keys||0,skins:Array.isArray(s.skins)?s.skins:['base'],skin:s.skin||'base'}}catch(e){}
const SKINS={
 base:{name:'Чичи',head:'#5b6470',visor:'#1d2228',vest:'#2fa65a',shirt:'#ffffff',legs:'#f28c28',glow:'#f5c400',shoe:INK},
 candy:{name:'Карамельный',head:'#ff8cc6',visor:'#5a1f3d',vest:'#3fd6b0',shirt:'#fff4fa',legs:'#ffd23f',glow:'#ffffff',shoe:'#ff5fa2'},
 fire:{name:'Огненный',head:'#d6452f',visor:'#2a0a05',vest:'#ff9a1f',shirt:'#2b2f36',legs:'#ff5a1f',glow:'#ffe14d',shoe:INK},
 gold:{name:'Золотой',head:'#d9a400',visor:'#3a2a00',vest:'#7a2fbf',shirt:'#fff3c4',legs:'#f5c400',glow:'#ffffff',shoe:'#7a2fbf'},
 ninja:{name:'Ниндзя',head:'#2b2f36',visor:'#000000',vest:'#d63a3a',shirt:'#3a3f48',legs:'#2b2f36',glow:'#ff4d4d',shoe:'#d63a3a'},
 ice:{name:'Ледяной',head:'#bfe6ff',visor:'#174a7a',vest:'#2f8fe0',shirt:'#eaf7ff',legs:'#7fd3ff',glow:'#5ff6ff',shoe:'#174a7a'}};
const SKIN_ORDER=['base','gold','ninja','ice','candy','fire'],SKIN_BY_LEVEL={1:'gold',2:'ninja',3:'ice',4:'candy',5:'fire'};
function persist(){try{localStorage.setItem(SAVE,JSON.stringify(save))}catch(e){}}

/* ---------- audio (built-in synth) ---------- */
let AC=null,muted=false,step=0;
let OUT=null,unlocked=false,silentEl=null;
function silentWav(){const n=4410,buf=new ArrayBuffer(44+n*2),v=new DataView(buf),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,44100,true);v.setUint32(28,88200,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  let s='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return 'data:audio/wav;base64,'+btoa(s)}
function initAudio(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  if(!unlocked){unlocked=true;try{silentEl=new Audio(silentWav());silentEl.loop=true;silentEl.setAttribute('playsinline','');const pr=silentEl.play();if(pr&&pr.catch)pr.catch(()=>{unlocked=false})}catch(e){unlocked=false}}
  else if(silentEl&&silentEl.paused){try{silentEl.play().catch(()=>{})}catch(e){}}
  try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const comp=AC.createDynamicsCompressor(),mg=AC.createGain();mg.gain.value=2.2;mg.connect(comp);comp.connect(AC.destination);OUT=mg;
      const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0)}
    if(AC.state!=='running')AC.resume()}catch(e){}}
document.addEventListener('touchend',initAudio,{passive:true});document.addEventListener('pointerdown',initAudio,{passive:true});
function tone(f,d,type,vol,slide,delay){if(!AC||muted)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vol||0.06,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(OUT);o.start(t);o.stop(t+d+0.03)}
function noise(d,vol){if(!AC||muted)return;const n=AC.sampleRate*d|0,buf=AC.createBuffer(1,n,AC.sampleRate),a=buf.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),g=AC.createGain();s.buffer=buf;g.gain.value=vol;s.connect(g);g.connect(OUT);s.start()}
const SFX={
  jump:()=>tone(330,0.16,'square',0.05,420),
  zap:()=>tone(1100,0.05,'sawtooth',0.03,-700),
  arrow:()=>tone(1400,0.14,'triangle',0.05,-1000),
  web:()=>{tone(400,0.22,'sine',0.07,900);tone(800,0.2,'square',0.02,600)},
  flag:()=>{tone(988,0.07,'square',0.04);tone(1319,0.12,'square',0.04,0,0.07)},
  block:()=>tone(220,0.1,'square',0.07,-60),
  skill:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.13,'square',0.05,0,i*0.08)),
  kill:()=>tone(620,0.14,'square',0.05,-480),
  stomp:()=>tone(170,0.14,'square',0.08,-90),
  hurt:()=>tone(220,0.28,'sawtooth',0.07,-150),
  nope:()=>tone(130,0.08,'square',0.05),
  bosshit:()=>tone(320,0.07,'square',0.05,-140),
  roar1:()=>{tone(480,0.6,'sawtooth',0.08,320);tone(240,0.6,'square',0.04,160)},
  roar2:()=>{noise(0.7,0.18);tone(1800,0.45,'sawtooth',0.02,-900)},
  roar3:()=>[0,1,2,3,4,5].forEach(i=>tone(300+(i%2)*140,0.13,'sine',0.09,0,i*0.1)),
  roar4:()=>{tone(150,0.8,'sawtooth',0.1,-70);tone(95,0.8,'square',0.06,-30);noise(0.5,0.12)},
  roar5:()=>{tone(392,0.25,'square',0.06);tone(330,0.25,'square',0.06);tone(392,0.35,'square',0.06,0,0.35);tone(330,0.35,'square',0.06,0,0.35)},
  honk:()=>{tone(392,0.3,'square',0.05);tone(330,0.3,'square',0.05)},
  splash:()=>{noise(0.25,0.12);tone(700,0.2,'sine',0.06,-450)},
  boom:()=>{noise(0.8,0.25);tone(90,0.6,'sawtooth',0.08,-50)},
  win:()=>[523,659,784,659,784,1047].forEach((f,i)=>tone(f,0.18,'square',0.06,0,i*0.13))
};
function sfx(n){SFX[n]&&SFX[n]()}
const MEL=[0,null,4,7,9,null,7,4,2,null,4,7,12,9,7,null],BOSSMEL=[0,0,3,0,6,5,3,null,0,0,3,0,7,6,3,null];
setInterval(()=>{if(!AC||muted||mode!=='play'||!G||G.paused)return;const boss=G.boss&&!G.boss.dead,mel=boss?BOSSMEL:MEL,root=boss?196:262,nn=mel[step%16];
  if(nn!==null)tone(root*Math.pow(2,nn/12),0.12,'triangle',0.03);
  if(step%4===0)tone(root/2*Math.pow(2,[0,0,5,7][(step>>2)%4]/12),0.22,'square',0.018);
  if(step%2===1)noise(0.03,0.02);step++},150);

/* ---------- helpers ---------- */
function rng(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
function hash(i){const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function aabb(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function circleRect(s,r){const nx=Math.max(r.x,Math.min(s.x,r.x+r.w)),ny=Math.max(r.y,Math.min(s.y,r.y+r.h));return(s.x-nx)**2+(s.y-ny)**2<s.r*s.r}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- levels ---------- */
const PAL={
 1:{sky1:'#6fcbea',sky2:'#d9f5cf',far:'#6dbd84',mid:'#34935a',near:'#1f6b3d',dirt:'#7a4a24',dirt2:'#5a3218',grass:'#4cc94f',pit:'#0b1a10'},
 2:{sky1:'#ff9cc8',sky2:'#ffe3ef',far:'#f6a9cc',mid:'#e2679f',near:'#b8417a',dirt:'#c95a8f',dirt2:'#a2416f',grass:'#ffd6e7',pit:'#3a0f24',brick:'#f06aa6',brick2:'#b33d76'},
 3:{sky1:'#ff8f57',sky2:'#ffd67a',far:'#b8693f',mid:'#6b4a2a',near:'#2e3a1f',dirt:'#6b3f22',dirt2:'#472812',grass:'#86c13f',pit:'#120a05'},
 4:{sky1:'#a8ecdf',sky2:'#fff1d6',far:'#f7b8d4',mid:'#c77dff',near:'#ff8fc2',dirt:'#6b3a1f',dirt2:'#4a2512',grass:'#fff0f6',pit:'#2a1208',brick:'#f2c27b',brick2:'#b8863f'},
 5:{sky1:'#7cc4ff',sky2:'#e3f4ff',far:'#c4d2e0',mid:'#c0504d',near:'#4f9a45',dirt:'#5d6670',dirt2:'#454c55',grass:'#b8c0c8',pit:'#1b1f24',brick:'#c8604a',brick2:'#8a3633'}};
const LNAME={1:'Джунгли',2:'Розовый город',3:'Закат в джунглях',4:'Фабрика сладостей',5:'Школа'};
const BOSSNAME={1:'Слоночерепаха',2:'Фиолетовый паук',3:'Розовая медуза',4:'Синяя горилла',5:'Серый фургон'};
const LAST=5,SKILLTXT={rollers:{text:'Ролики с ускорителями!',sub:'Теперь Чичи бегает быстрее'},web:{text:'Лазерная паутина!',sub:'Новая кнопка «Сеть» ловит любого врага'},nun:{text:'Водяные нунчаки!',sub:'Новая кнопка «Нунчаки» бьёт всех врагов рядом'}};

function mkEnemy(r,n,tx){n=Math.min(n,3);const v=r(),type=v<0.36?'chick':v<0.68?'mush':'bee';
  const e={type,x:tx*T+5,w:30,h:30,vx:r()<.5?-1:1,vy:0,t:r()*6,dead:0,dying:0};
  if(type==='chick'){e.h=32;e.y=10*T-e.h;e.sp=55+n*12}
  else if(type==='mush'){e.y=10*T-e.h;e.sp=40+n*10}
  else{e.h=26;e.baseY=340;e.y=340;e.ox=e.x;e.sp=60+n*10}
  return e}

function buildLevel(n){
  const w=[0,110,125,140,145,150][n],r=rng(n*7919+13),g=[];
  for(let y=0;y<ROWS;y++)g.push(new Uint8Array(w));
  for(let x=0;x<w;x++){g[10][x]=1;g[11][x]=1}
  const en=[],fl=[],keys=[],blocks={},arenaL=w-26;
  g[7][6]=2;g[7][7]=3;g[7][8]=2;blocks['7,7']='skill';
  fl.push({x:3.5*T,y:8.6*T},{x:4.5*T,y:8.6*T});
  let x=12;
  while(x<arenaL-12){
    const k=r();
    if(k<0.26){const len=2+(r()<0.25*Math.min(n,3)?1:0);for(let i=0;i<len;i++){g[10][x+i]=0;g[11][x+i]=0}fl.push({x:(x+len/2)*T,y:6.6*T});x+=len+3}
    else if(k<0.5){const len=3+Math.floor(r()*3);for(let i=0;i<len;i++)g[7][x+i]=2;
      const lx=x+Math.floor(len/2);g[7][lx]=3;blocks['7,'+lx]='auto';
      for(let i=0;i<len;i++)if(x+i!==lx&&r()<0.6)fl.push({x:(x+i+.5)*T,y:6.3*T});
      if(!keys.length&&x>arenaL*0.45)keys.push({x:(x+len/2)*T,y:5.4*T});
      en.push(mkEnemy(r,n,x+len+1));x+=len+4}
    else if(k<0.66){const h=1+Math.floor(r()*2);for(let i=0;i<2;i++)for(let j=1;j<=h;j++)g[10-j][x+i]=1;fl.push({x:(x+1)*T,y:(9.4-h)*T});x+=5}
    else{en.push(mkEnemy(r,n,x+2));if(r()<0.35+Math.min(n,3)*0.12)en.push(mkEnemy(r,n,x+5));fl.push({x:(x+3.5)*T,y:8.3*T});x+=8}
  }
  for(let y=0;y<10;y++)g[y][w-1]=5;
  for(let i=0;i<3;i++){g[7][arenaL+6+i]=2;g[7][arenaL+16+i]=2}
  if(!keys.length)keys.push({x:(arenaL-4)*T,y:8.5*T});
  return{w,g,enemies:en,flags:fl,keys,blocks,arenaL};
}

function moveEnt(e,dx,dy){
  const res={hx:0,hy:0,head:null};
  e.x+=dx;
  if(dx){const t0=Math.floor(e.y/T),t1=Math.floor((e.y+e.h-0.01)/T);
    if(dx>0){const tx=Math.floor((e.x+e.w)/T);for(let ty=t0;ty<=t1;ty++)if(solidAt(tx,ty)){e.x=tx*T-e.w-0.001;res.hx=1;break}}
    else{const tx=Math.floor(e.x/T);for(let ty=t0;ty<=t1;ty++)if(solidAt(tx,ty)){e.x=(tx+1)*T+0.001;res.hx=-1;break}}}
  e.y+=dy;
  if(dy){const l0=Math.floor(e.x/T),l1=Math.floor((e.x+e.w-0.01)/T);
    if(dy>0){const ty=Math.floor((e.y+e.h)/T);for(let tx=l0;tx<=l1;tx++)if(solidAt(tx,ty)){e.y=ty*T-e.h-0.001;res.hy=1;break}}
    else{const ty=Math.floor(e.y/T);let best=null;const c=e.x+e.w/2;

      if(best!==null)res.head=[best,ty]}}
  return res;
}

/* ---------- items & flags ---------- */
function updItems(dt){const p=G.p;
  for(const it of G.items){if(it.rise>0){it.rise-=dt;it.y=it.startY-28*(1-Math.max(0,it.rise)/0.5);continue}
    if(aabb(p,it)){it.got=1;
      if(SKILLTXT[it.kind]){save.skills[it.kind]=true;persist();syncBtns();sfx('skill');G.banner=Object.assign({t:3},SKILLTXT[it.kind])}
      else if(it.kind==='heal'){p.hp=20;save.flags+=10;G.flagsLevel+=10;persist();sfx('skill');G.banner={text:'Супер-бонус!',sub:'Полоски полные и +10 флажков',t:2.6}}
      else{p.hp=Math.min(20,p.hp+6);sfx('skill');addText(it.x+14,it.y-10,'+6 к полоскам','#5ee06a')}
      burst(it.x+14,it.y+14,'#fff176',14,220)}}
  G.items=G.items.filter(i=>!i.got);
  for(const f of G.flags){if(f.got)continue;if(Math.abs(p.x+p.w/2-f.x)<22&&p.y<f.y+16&&p.y+p.h>f.y-16){f.got=1;save.flags++;G.flagsLevel++;sfx('flag');burst(f.x,f.y,'#ff5a36',6,120)}}
  for(const k of G.keys){if(k.got)continue;if(Math.abs(p.x+p.w/2-k.x)<24&&p.y<k.y+18&&p.y+p.h>k.y-18){k.got=1;save.keys++;persist();sfx('skill');burst(k.x,k.y,'#ffd54a',14,200);G.banner={text:'Ключик!',sub:'Им можно открыть клетку после босса',t:2.6}}}
  const cg=G.cage;
  if(cg&&!cg.done){
    if(cg.y<cg.ty){cg.vy+=1500*dt;cg.y=Math.min(cg.ty,cg.y+cg.vy*dt);if(cg.y>=cg.ty){G.shake=0.2;sfx('stomp')}}
    else if(aabb(p,cg)){cg.done=1;
      if(save.keys>0){save.keys--;if(!save.skins.includes(cg.skin))save.skins.push(cg.skin);save.skin=cg.skin;persist();cg.open=1;sfx('win');
        burst(cg.x+cg.w/2,cg.y+cg.h/2,'#fff176',22,260);G.banner={text:'Новый скин: '+SKINS[cg.skin].name+'!',sub:'Сменить скин можно в меню',t:3.2}}
      else{sfx('nope');G.banner={text:'Нужен ключик',sub:'Найди ключик на уровне и победи босса ещё раз',t:3.2}}
      G.endT=3.4}}
}

/* ---------- main update ---------- */
function update(dt){if(mode!=='play')return;G.time+=dt;
  updPlayer(dt);if(mode!=='play')return;
  updEnemies(dt);updShots(dt);if(G.boss)updBoss(dt);updItems(dt);
  for(const q of G.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=700*dt;q.life-=dt}G.parts=G.parts.filter(q=>q.life>0);
  for(const t of G.texts){t.y-=40*dt;t.life-=dt}G.texts=G.texts.filter(t=>t.life>0);
  for(const b of G.bumps)b.t-=dt;G.bumps=G.bumps.filter(b=>b.t>0);
  if(G.banner)G.banner.t-=dt;G.shake-=dt;
  const L=G.lv,p=G.p;
  if(!G.boss&&p.x>(L.arenaL+3)*T)spawnBoss();
  let cx=p.x+p.w/2-viewW*0.42;const minX=G.locked?L.arenaL*T:0,maxX=L.w*T-viewW;cx=clamp(cx,minX,Math.max(minX,maxX));
  G.cam+=(cx-G.cam)*Math.min(1,dt*8);
  if(G.endT>0){G.endT-=dt;if(G.endT<=0)levelDone()}
}

      c.globalAlpha=pulse;c.fillStyle='#5b3f00';c.font='26px "Russo One",sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('?',x+T/2,y+T/2+2);c.globalAlpha=1;
      c.fillStyle='#fff3b0';[[6,6],[T-8,6],[6,T-8],[T-8,T-8]].forEach(d=>c.fillRect(x+d[0],y+d[1],3,3))}
    else if(t===4){c.fillStyle='#8a6a3a';rr(c,x+1,y+1,T-2,T-2,5);c.fill();c.strokeStyle='#5a4220';c.lineWidth=3;c.stroke();c.fillStyle='#5a4220';[[6,6],[T-9,6],[6,T-9],[T-9,T-9]].forEach(d=>c.fillRect(x+d[0],y+d[1],3,3))}
    else if(t===5){c.fillStyle='#4a5245';c.fillRect(x,y,T,T);c.strokeStyle='#323830';c.lineWidth=2;c.strokeRect(x+1,y+1,T-2,T-2);c.fillStyle=G.n===2?'#ff8cc0':'#3a8a3a';if(ty%3===0)c.fillRect(x,y,T,4)}
  }}

function render(){
  const c=ctx,pal=PAL[G.n];c.setTransform(DPR*scale,0,0,DPR*scale,0,0);c.textAlign='left';
  bg(pal);
  const sh=(G.shake>0&&!REDUCED)?G.shake*14:0;
  c.save();c.translate(-Math.round(G.cam)+(Math.random()-.5)*sh,offY+(Math.random()-.5)*sh);
  for(const it of G.items){const bob=it.rise>0?0:Math.sin(G.time*4)*3;c.fillStyle='rgba(255,241,118,.35)';c.beginPath();c.arc(it.x+14,it.y+14+bob,20+Math.sin(G.time*6)*2,0,7);c.fill();drawItemIcon(c,it.kind,it.x+14,it.y+14+bob,1)}
  drawTiles(pal);
  for(const f of G.flags)if(!f.got)drawFlag(f.x,f.y,G.time);
  for(const k of G.keys)if(!k.got)drawKey(k.x,k.y+Math.sin(G.time*3)*3);
  if(G.cage)drawCage(G.cage);
  for(const e of G.enemies){if(e.dying&&e.squash)c.globalAlpha=Math.max(0,e.dead/0.45);if(e.type==='chick')drawChick(e);else if(e.type==='mush')drawMush(e);else drawBee(e);c.globalAlpha=1}
  const b=G.boss;
  if(b){c.save();if(b.flash>0)c.globalAlpha=0.5;if(b.dead)c.globalAlpha=Math.max(0,1-b.deadT/2);
    [null,drawTurtle,drawSpider,drawJelly,drawGorilla,drawVan][b.n](b);c.restore()}
  for(const s of G.eshots){c.lineWidth=2;
    if(s.kind==='water'){c.fillStyle='#4fb6ff';c.strokeStyle='#1d5c99';c.beginPath();c.arc(s.x,s.y,s.r,0,7);c.fill();c.stroke();c.fillStyle='#d6f0ff';c.beginPath();c.arc(s.x-3,s.y-3,3,0,7);c.fill()}
    else if(s.kind==='webball'){c.fillStyle='#efe6ff';c.strokeStyle='#7b3fbf';c.beginPath();c.arc(s.x,s.y,s.r,0,7);c.fill();c.stroke();c.beginPath();c.moveTo(s.x-s.r,s.y);c.lineTo(s.x+s.r,s.y);c.moveTo(s.x,s.y-s.r);c.lineTo(s.x,s.y+s.r);c.stroke()}
    else if(s.kind==='cake')drawCake(c,s.x,s.y,s.rot);
    else if(s.kind==='desk'){c.save();c.translate(s.x,s.y);c.rotate(s.rot);c.fillStyle='#c48a4a';c.strokeStyle='#6b4520';rr(c,-17,-8,34,8,2);c.fill();c.stroke();c.fillStyle='#6b737c';c.fillRect(-14,0,4,14);c.fillRect(10,0,4,14);c.restore()}
    else if(s.kind==='chair'){c.save();c.translate(s.x,s.y);c.rotate(s.rot);c.fillStyle='#e05a3a';c.strokeStyle='#8a2f1c';rr(c,-11,0,22,6,2);c.fill();c.stroke();rr(c,6,-15,5,17,2);c.fill();c.stroke();c.fillStyle='#6b737c';c.fillRect(-10,6,3,10);c.fillRect(7,6,3,10);c.restore()}
    else{c.fillStyle='rgba(255,122,184,.35)';c.beginPath();c.arc(s.x,s.y,s.r+5,0,7);c.fill();c.fillStyle='#ff4fa3';c.strokeStyle='#8e2a5a';c.beginPath();c.arc(s.x,s.y,s.r,0,7);c.fill();c.stroke()}}
  const p=G.p;
  if(p.spin>0&&mode!=='menu'){const cx=p.x+p.w/2,cy=p.y+p.h/2,a=(0.35-p.spin)/0.35*Math.PI*4*p.face;c.save();
    c.strokeStyle='rgba(95,200,255,.5)';c.lineWidth=12;c.beginPath();c.arc(cx,cy,64,a-1.6*p.face,a,p.face<0);c.stroke();
    c.strokeStyle='rgba(225,247,255,.95)';c.lineWidth=3;c.beginPath();c.arc(cx,cy,64,a-1.1*p.face,a,p.face<0);c.stroke();
    const hx=cx+Math.cos(a)*24,hy=cy+Math.sin(a)*24;c.strokeStyle='#2f8fe0';c.lineWidth=2;c.beginPath();c.moveTo(cx,cy);c.lineTo(hx,hy);c.stroke();
    c.translate(hx,hy);c.rotate(a);c.fillStyle='#5fc8ff';c.strokeStyle=INK;rr(c,0,-4,36,8,4);c.fill();c.stroke();c.restore()}
  if(mode!=='menu'&&!(p.inv>0&&Math.floor(G.time*16)%2)){
    drawChichi(c,p.x+p.w/2,p.y+p.h+2,p.face,{walk:p.walk,moving:Math.abs(p.vx)>30&&p.onGround,air:!p.onGround,punch:p.punch>0,punchSide:p.punchSide,bow:p.bowT>0,roll:save.skills.rollers,blink:(G.time%3.3)<0.12})}
  for(const s of G.shots){
    if(s.kind==='zap'){c.fillStyle='#fff59d';c.beginPath();c.arc(s.x,s.y,6,0,7);c.fill();c.strokeStyle='#4fd8ff';c.lineWidth=2.5;c.beginPath();
      for(let i=0;i<5;i++){const a=Math.random()*6.28;c.moveTo(s.x,s.y);c.lineTo(s.x+Math.cos(a)*11,s.y+Math.sin(a)*11)}c.stroke()}
    else if(s.kind==='arrow'){const d=Math.sign(s.vx);c.strokeStyle='#f5c400';c.lineWidth=3.5;c.beginPath();c.moveTo(s.x-d*14,s.y);c.lineTo(s.x+d*10,s.y);c.stroke();
      c.fillStyle='#ffe066';c.strokeStyle='#8a6500';c.lineWidth=1.5;c.beginPath();c.moveTo(s.x+d*16,s.y);c.lineTo(s.x+d*8,s.y-5);c.lineTo(s.x+d*8,s.y+5);c.closePath();c.fill();c.stroke();
      c.fillStyle='#fff3b0';c.beginPath();c.moveTo(s.x-d*14,s.y);c.lineTo(s.x-d*20,s.y-5);c.lineTo(s.x-d*16,s.y);c.lineTo(s.x-d*20,s.y+5);c.closePath();c.fill()}
    else{c.save();c.translate(s.x,s.y);c.rotate(s.t*8);c.strokeStyle='#ff3d6e';c.lineWidth=2.5;[6,12,16].forEach(r=>{c.beginPath();c.arc(0,0,r,0,7);c.stroke()});
      c.strokeStyle='#5ff';c.lineWidth=2;for(let i=0;i<8;i++){const a=i/8*6.28;c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(a)*17,Math.sin(a)*17);c.stroke()}c.restore()}}
  for(const q of G.parts){c.globalAlpha=Math.max(0,q.life/q.max);c.fillStyle=q.color;c.fillRect(q.x-q.size/2,q.y-q.size/2,q.size,q.size)}c.globalAlpha=1;
  c.textAlign='center';c.textBaseline='middle';c.font='15px "Russo One",sans-serif';c.lineJoin='round';
  for(const t of G.texts){c.globalAlpha=Math.min(1,t.life*2);c.lineWidth=4;c.strokeStyle='#10231a';c.strokeText(t.text,t.x,t.y);c.fillStyle=t.color;c.fillText(t.text,t.x,t.y)}c.globalAlpha=1;
  c.restore();
  if(offY+LH<viewH){c.fillStyle=pal.dirt2;c.fillRect(0,offY+LH,viewW,viewH-offY-LH);c.fillStyle='rgba(0,0,0,.25)';c.fillRect(0,offY+LH,viewW,viewH-offY-LH)}
  if(offY>0){c.fillStyle='rgba(0,0,0,0)'}
  if(mode!=='menu')drawHUD();
}
function drawHUD(){const c=ctx,p=G.p,sx=SA.l/scale+12,sy=SA.t/scale+10;
  c.fillStyle='rgba(10,30,18,.6)';rr(c,sx-8,sy-6,214,66,12);c.fill();
  for(let b=0;b<2;b++){const filled=b===0?Math.min(p.hp,10):Math.max(0,p.hp-10);
    for(let i=0;i<10;i++){c.fillStyle=i<filled?(b===0?'#5ee06a':'#4fd8ff'):'rgba(255,255,255,.16)';rr(c,sx+i*17,sy+b*15,14,11,3);c.fill()}}
  c.save();drawFlagIconHUD(sx+6,sy+44);c.restore();
  c.fillStyle='#fff8e1';c.font='16px "Russo One",sans-serif';c.textAlign='left';c.textBaseline='middle';c.fillText(String(save.flags),sx+20,sy+45);
  drawKey(sx+66,sy+45,0.65);c.fillStyle='#fff8e1';c.font='16px "Russo One",sans-serif';c.textAlign='left';c.fillText(String(save.keys),sx+78,sy+45);
  let ix=sx+112;if(save.skills.rollers){drawItemIcon(c,'rollers',ix,sy+44,0.6);ix+=26}if(save.skills.web){drawItemIcon(c,'web',ix,sy+44,0.7);ix+=26}
  c.fillStyle='rgba(255,248,225,.75)';c.font='12px "Russo One",sans-serif';c.textAlign='right';c.fillText('Ур. '+G.n,sx+198,sy+45);
  const b=G.boss;
  if(b&&!b.dead){const bw=Math.min(260,viewW-sx*2-60),wide=viewW>=700,bx=wide?viewW/2-bw/2:sx-8,by=wide?sy+4:sy+70;
    c.fillStyle='rgba(10,30,18,.6)';rr(c,bx-8,by-6,bw+16,40,10);c.fill();
    c.fillStyle='#fff8e1';c.font='13px "Russo One",sans-serif';c.textAlign='left';c.fillText(BOSSNAME[b.n],bx,by+6);
    c.fillStyle='rgba(255,255,255,.16)';rr(c,bx,by+16,bw,10,5);c.fill();c.fillStyle=['','#7fd36a','#b07cf0','#ff7ab8','#4f8bff','#b8c0c8'][b.n];rr(c,bx,by+16,Math.max(0,bw*b.hp/b.max),10,5);c.fill()}
  if(G.banner&&G.banner.t>0){const a=Math.min(1,G.banner.t*2,(3-G.banner.t)*3);c.globalAlpha=Math.max(0,Math.min(1,a));c.textAlign='center';c.lineJoin='round';
    const y=offY+150;c.font='30px "Russo One",sans-serif';c.lineWidth=7;c.strokeStyle='#10231a';c.strokeText(G.banner.text,viewW/2,y);c.fillStyle='#f5c400';c.fillText(G.banner.text,viewW/2,y);
    if(G.banner.sub){c.font='800 16px Nunito,sans-serif';c.lineWidth=5;c.strokeText(G.banner.sub,viewW/2,y+32);c.fillStyle='#fff8e1';c.fillText(G.banner.sub,viewW/2,y+32)}
    c.globalAlpha=1}
}
function drawFlagIconHUD(x,y){const c=ctx;c.strokeStyle='#fff8e1';c.lineWidth=2.5;c.beginPath();c.moveTo(x-5,y+9);c.lineTo(x-5,y-9);c.stroke();c.fillStyle='#ff5a36';c.beginPath();c.moveTo(x-4,y-9);c.lineTo(x+9,y-4);c.lineTo(x-4,y+1);c.closePath();c.fill()}

/* ---------- screens ---------- */
function showOv(html){ov.innerHTML=html;ov.hidden=false}
function hideOv(){ov.hidden=true}
function clearKeys(){for(const k in K)K[k]=0;document.querySelectorAll('.btn.on').forEach(b=>b.classList.remove('on'))}
function showMenu(){
  const cont=save.level>1;
  showOv(`<div class="card"><canvas id="hero" width="260" height="360"></canvas><div class="col">
    <h1>Чичи<span>в джунглях</span></h1>
    <p class="sub">Киборг Чичи идёт через джунгли, розовый город, фабрику сладостей и школу. Победи пятерых боссов!</p>
    <div class="btns"><button class="go" data-act="play">${cont?'Продолжить · уровень '+save.level:'Играть'}</button>${cont?'<button class="ghost" data-act="new">Сначала</button>':''}</div>
    <div class="skins">${SKIN_ORDER.map((id,i)=>{const own=save.skins.includes(id);return `<button class="skin${save.skin===id?' sel':''}" data-skin="${id}" ${own?'':'disabled'}><canvas width="72" height="104" data-sk="${id}"></canvas>${own?SKINS[id].name:'Клетка '+i}</button>`}).join('')}</div>
    <ul class="rules"><li><b>Цыплята</b> — кулаками</li><li><b>Пчёлы</b> — стрелами</li><li><b>Грибы</b> — прыгни сверху</li></ul></div></div>`);
  const hc=document.getElementById('hero'),h=hc.getContext('2d');h.clearRect(0,0,260,360);drawChichi(h,130,345,1,{roll:save.skills.rollers},1.45);
  ov.querySelectorAll('canvas[data-sk]').forEach(cn=>{const g=cn.getContext('2d'),id=cn.dataset.sk;if(!save.skins.includes(id))g.globalAlpha=0.35;drawChichi(g,36,100,1,{skin:id},0.44)});
}
function startLevel(n){G=newState(n);mode='play';hideOv();clearKeys();ctl.hidden=false;topBar.hidden=false;syncBtns();initAudio();lockWake()}
function syncBtns(){bWeb.hidden=!save.skills.web;bNun.hidden=!save.skills.nun}
function toMenu(){mode='menu';clearKeys();G=newState(save.level);ctl.hidden=true;topBar.hidden=true;showMenu()}
function gameOver(){mode='over';clearKeys();ctl.hidden=true;topBar.hidden=true;
  showOv(`<div class="card"><h2>Ой! Полоски закончились</h2><p class="sub">Чичи немного устал. Флажки остаются с тобой. Попробуем уровень ${G.n} ещё раз?</p>
  <div class="btns"><button class="go" data-act="retry">Ещё раз</button><button class="ghost" data-act="menu">В меню</button></div></div>`)}
function levelDone(){const n=G.n;mode='done';clearKeys();ctl.hidden=true;topBar.hidden=true;
  if(n<LAST){save.level=n+1;persist();
    showOv(`<div class="card"><h2>Уровень ${n} пройден!</h2><p class="sub">Босс «${BOSSNAME[n]}» побеждён. Флажков за уровень: ${G.flagsLevel}. Всего: ${save.flags}.</p>
    <div class="btns"><button class="go" data-act="next">Дальше · уровень ${n+1}</button><button class="ghost" data-act="menu">В меню</button></div></div>`)}
  else{save.level=1;persist();
    showOv(`<div class="card"><h2>Победа!</h2><p class="sub">Чичи победил всех пятерых боссов. Собрано флажков: ${save.flags}.</p>
    <div class="btns"><button class="go" data-act="new">Играть заново</button><button class="ghost" data-act="menu">В меню</button></div></div>`)}}
function setPause(on){if(mode!=='play')return;G.paused=on;clearKeys();
  if(on)showOv(`<div class="card"><h2>Пауза</h2><div class="btns"><button class="go" data-act="resume">Продолжить</button><button class="ghost" data-act="menu">В меню</button></div></div>`);else hideOv()}
ov.addEventListener('click',e=>{const sb=e.target.closest('[data-skin]');if(sb&&!sb.disabled){save.skin=sb.dataset.skin;persist();showMenu();return}
  const a=e.target.closest('[data-act]');if(!a)return;initAudio();const act=a.dataset.act;
  if(act==='play')startLevel(save.level);
  else if(act==='new'){save.level=1;save.skills={rollers:false,web:false};save.flags=0;persist();startLevel(1)}
  else if(act==='retry')startLevel(G.n);
  else if(act==='next')startLevel(save.level);
  else if(act==='resume')setPause(false);
  else if(act==='menu')toMenu()});
document.getElementById('bPause').addEventListener('click',()=>setPause(!G.paused));
const bSound=document.getElementById('bSound');bSound.addEventListener('click',()=>{muted=!muted;bSound.classList.toggle('off',muted);initAudio()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play'&&!G.paused)setPause(true)});
let wl=null;async function lockWake(){try{if(navigator.wakeLock&&!wl)wl=await navigator.wakeLock.request('screen');if(wl)wl.addEventListener('release',()=>{wl=null})}catch(e){}}

/* ---------- input ---------- */
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;
  const on=e=>{e.preventDefault();K[k]=1;b.classList.add('on');initAudio()};
  const off=e=>{e.preventDefault();K[k]=0;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);
  b.addEventListener('contextmenu',e=>e.preventDefault())});
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',Space:'jump',KeyW:'jump',KeyZ:'fist',KeyJ:'fist',KeyX:'bow',KeyK:'bow',KeyC:'web',KeyL:'web',KeyV:'nun',KeyI:'nun'};
addEventListener('keydown',e=>{const k=KEYMAP[e.code];if(k&&mode==='play'){K[k]=1;e.preventDefault()}if(e.code==='Escape'||e.code==='KeyP')setPause(!(G&&G.paused))});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)K[k]=0});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(G){if(mode==='play'&&!G.paused){update(dt/2);update(dt/2)}
    else if(mode==='menu'){G.time+=dt;G.cam+=30*dt;if(G.cam>G.lv.w*T-viewW)G.cam=0}
    render()}
  requestAnimationFrame(frame)}
toMenu();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{if(mode==='menu')showMenu()});
requestAnimationFrame(frame);
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
